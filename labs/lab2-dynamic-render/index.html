<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 - Dynamic Rendering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <h1 class="mb-4">Demo Kartu Proyek Dinamis</h1>

  <!-- Ini KOSONG sengaja, nanti diisi otomatis oleh JavaScript -->
  <div class="row row-cols-1 row-cols-md-2 g-4" id="projectGrid"></div>

  <!-- UNIVERSAL MODAL: cuma 1 modal buat semua proyek -->
  <div class="modal fade" id="universalProjectModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="projectModalTitle">Judul Proyek</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="projectModalBody">
          <!-- Diisi otomatis pas tombol diklik -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
