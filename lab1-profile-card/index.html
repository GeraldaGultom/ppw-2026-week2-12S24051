<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile Card - PPW Del</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <article class="profile-card">
      <div class="card-header-banner"></div>
      <div class="card-body">
        <div class="avatar-container">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop"
               alt="Foto Profil Mahasiswa" class="avatar-img">
          <span class="status-badge">Aktif</span>
        </div>
        <h1 class="user-name">Geralda Natali Gultom</h1>
        <p class="user-role">Mahasiswa S1 Sistem Informasi</p>
        <p class="user-bio">
          Information systems student, aspiring software engineer and data analytics enthusiast.
        </p>

        <section class="skills-section">
          <h2 class="section-title">Keahlian Utama</h2>
          <ul class="skills-list">
            <li class="skill-tag">HTML5 Semantic</li>
            <li class="skill-tag">Modern CSS</li>
            <li class="skill-tag">UI/UX (Figma)</li>
            <li class="skill-tag">Data Analytics</li>
          </ul>
        </section>

        <div class="stats-container">
          <div class="stat-item"><span class="stat-val">3</span><span class="stat-lbl">Proyek</span></div>
          <div class="stat-item"><span class="stat-val">1</span><span class="stat-lbl">Magang</span></div>
          <div class="stat-item"><span class="stat-val">100%</span><span class="stat-lbl">A11y</span></div>
        </div>

        <div class="card-actions">
          <a href="#kontak" class="btn btn-primary">Kirim Pesan</a>
          <a href="../index.html" class="btn btn-secondary">Lihat Portofolio</a>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
